<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HelzerX 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}body{display:grid;place-items:center}.scene{perspective:1000px}.logo{width:280px;height:280px;position:relative;transform-style:preserve-3d;animation:spin 6s linear infinite}.face{position:absolute;inset:0;border-radius:28% 45% 35% 42%;background:linear-gradient(135deg,#fff,#ff7070 18%,#e00012 48%,#610006);box-shadow:0 0 45px #e000123d;transform:translateZ(22px)}.face:after{content:'';position:absolute;width:110px;height:110px;left:70px;top:85px;border-radius:45%;background:#000;transform:skewY(-25deg)}.back{transform:rotateY(180deg) translateZ(22px)}.edge{position:absolute;inset:0;border-radius:28% 45% 35% 42%;background:#92000b;transform:translateZ(0)}@keyframes spin{from{transform:rotateY(0) rotateX(3deg)}to{transform:rotateY(360deg) rotateX(3deg)}}@media(prefers-reduced-motion:reduce){.logo{animation:none}}</style></head><body><div class="scene"><div class="logo"><div class="edge"></div><div class="face"></div><div class="face back"></div></div></div></body></html>
