<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HelzerX — 3D Logo</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
body{overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,#280307,#080101 48%,#000 78%)}
.scene{width:min(86vw,720px);aspect-ratio:1;display:grid;place-items:center;perspective:1200px}
.logo{width:360px;height:360px;position:relative;transform-style:preserve-3d;animation:spin 7s cubic-bezier(.45,.05,.55,.95) infinite;filter:drop-shadow(0 38px 34px #000)}
.layer,.layer *{position:absolute;transform-style:preserve-3d}
.layer{inset:0}
.part{background:linear-gradient(145deg,#fff7f7 0%,#ff9b9b 15%,#ff2633 40%,#c6000d 68%,#610006 100%);box-shadow:inset 9px 7px 14px #fff5,inset -12px -16px 22px #3b0008,0 0 24px #ff001d22}
.left{width:86px;height:270px;left:57px;top:45px;border-radius:52px;transform:rotate(-28deg) skewY(-9deg)}
.left2{width:70px;height:225px;left:100px;top:74px;border-radius:40px;transform:rotate(0deg)}
.bridge{width:205px;height:82px;left:105px;top:144px;border-radius:52% 18% 42% 28%;transform:rotate(-21deg) skewX(-12deg)}
.right{width:92px;height:285px;right:57px;top:38px;border-radius:48px;transform:rotate(0deg)}
.cut{width:76px;height:165px;left:105px;top:92px;border-radius:38px;background:#090101;transform:rotate(0deg);box-shadow:inset 10px 0 18px #000}
.glow{position:absolute!important;inset:0;background:radial-gradient(ellipse at 28% 20%,#fff8 0,transparent 18%);filter:blur(4px);transform:translateZ(14px)}
.back{transform:rotateY(180deg) translateZ(28px)}
.front{transform:translateZ(28px)}
.depth1{transform:translateZ(21px);filter:brightness(.78)}
.depth2{transform:translateZ(14px);filter:brightness(.62)}
.depth3{transform:translateZ(7px);filter:brightness(.48)}
.floor{position:absolute;width:52%;height:13%;bottom:15%;border-radius:50%;background:#ff001d44;filter:blur(28px);transform:rotateX(72deg) translateZ(-110px)}
@keyframes spin{0%,8%{transform:rotateY(-24deg) rotateX(5deg)}46%{transform:rotateY(180deg) rotateX(-3deg)}92%,100%{transform:rotateY(336deg) rotateX(5deg)}}
@media(max-width:520px){.logo{width:270px;height:270px}}
@media(prefers-reduced-motion:reduce){.logo{animation:none}}
</style>
</head>
<body>
<div class="scene">
<div class="floor"></div>
<div class="logo">
<div class="layer depth3"><i class="part left"></i><i class="part left2"></i><i class="part bridge"></i><i class="part right"></i><i class="cut"></i></div>
<div class="layer depth2"><i class="part left"></i><i class="part left2"></i><i class="part bridge"></i><i class="part right"></i><i class="cut"></i></div>
<div class="layer depth1"><i class="part left"></i><i class="part left2"></i><i class="part bridge"></i><i class="part right"></i><i class="cut"></i></div>
<div class="layer front"><i class="part left"></i><i class="part left2"></i><i class="part bridge"></i><i class="part right"></i><i class="cut"></i><i class="glow"></i></div>
<div class="layer back"><i class="part left"></i><i class="part left2"></i><i class="part bridge"></i><i class="part right"></i><i class="cut"></i></div>
</div>
</div>
</body>
</html>
