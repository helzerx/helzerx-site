name: HelzerX CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Validate automation syntax
        run: node --check automation/index.mjs
      - name: Dependency security audit
        run: npm audit --omit=dev --audit-level=high
